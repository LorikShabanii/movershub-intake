[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "movershub-intake"
version = "0.1.0"
description = "Multilingual LLM extraction for moving requests, with rule checks, clarification flows and an evaluation gate."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.50",
    "mistralai>=1.0",
    "anthropic>=1.0",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
